<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/products.css">

<body data-page="support">
  <header id="site-header"></header>

  <main class="container">
    <h1 class="page-title">Hỗ trợ & Liên hệ</h1>

    <div class="two-col">
      <div class="box">
        <h3>Thông tin cửa hàng</h3>
        <p>12 Nguyễn Văn Linh, Quận 7, TP.HCM</p>
        <p>Hotline tư vấn kỹ thuật: 0900 123 456</p>
        <p>Giờ mở cửa: 8:00 – 20:00 hằng ngày</p>

        <button class="btn light" data-act="demo">Messenger</button>

      <div class="box">
        <h3>Gửi câu hỏi</h3>
        <input class="field" placeholder="Họ tên">
        <input class="field" placeholder="Email hoặc số điện thoại">
        <textarea class="field" rows="4" placeholder="Nội dung cần tư vấn"></textarea>
        <button class="btn" data-act="demo">Gửi</button>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
